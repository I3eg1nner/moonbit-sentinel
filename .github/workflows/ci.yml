name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        uses: moonbit-community/setup-moonbit@main
        with:
          version: latest

      - name: Update registry index
        run: moon update

      - name: Check
        run: moon check

      - name: Test
        run: moon test

      - name: Build (wasm)
        run: moon build --target wasm

      - name: Build (native)
        run: moon build --target native --release

      - name: Self-scan (dogfood)
        run: |
          ENGINE=$(find _build/native/release -type f -executable | head -1)
          # 恶意 canary 必须触发门禁（非零退出）
          if "$ENGINE" scan canaries/typo_malicious --fail-on malicious > /dev/null; then
            echo "ERROR: malicious canary did not trip the CI gate"; exit 1
          fi
          # 良性 canary 必须通过（零退出）
          "$ENGINE" scan canaries/benign_http --fail-on malicious
